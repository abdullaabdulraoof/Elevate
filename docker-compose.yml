services:
  backend:
    build: ./backend
    container_name: gym-backend

    ports:
      - "3000:3000"

    env_file:
      - ./backend/.env

    environment:
      - REDIS_HOST=redis
      - MONGODB_URI=mongodb://mongodb:27017/elevate

    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

    restart: unless-stopped

  mongodb:
    image: mongo:8

    container_name: gym-mongodb

    ports:
      - "27017:27017"

    volumes:
      - mongo-data:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

    restart: unless-stopped

  redis:
    image: redis:7

    container_name: gym-redis

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped

volumes:
  mongo-data:
